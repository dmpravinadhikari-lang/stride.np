<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Four minutes at the window">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B3468"/>
      <stop offset="100%" stop-color="#12244A"/>
    </linearGradient>
    <pattern id="rule" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(24)">
      <line x1="0" y1="0" x2="0" y2="34" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#g)"/>
  <rect width="1200" height="630" fill="url(#rule)"/>
  <circle cx="1035" cy="140" r="250" fill="#FFFFFF" fill-opacity="0.03"/>
  <circle cx="1035" cy="140" r="170" fill="#FFFFFF" fill-opacity="0.03"/>

  <g font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="80" y="118" fill="#8FA3C8" font-size="21" font-weight="600" letter-spacing="4.2">USA · INTERVIEW</text>
    <rect x="80" y="146" width="62" height="4" fill="#E1362C"/>
    <text x="80" y="300" fill="#FFFFFF" font-size="86" font-weight="700" letter-spacing="-2.4">Four minutes</text>
    <text x="80" y="400" fill="#FFFFFF" font-size="86" font-weight="700" letter-spacing="-2.4">at the window</text>

    <g transform="translate(80, 548)">
      <text x="0" y="0" fill="#FFFFFF" font-size="34" font-weight="700" letter-spacing="-1.2">Stride</text>
      <circle cx="98" cy="-6" r="7" fill="#E1362C"/>
    </g>
    <text x="1120" y="548" fill="#8FA3C8" font-size="20" font-weight="500" text-anchor="end">Written for Nepali students</text>
  </g>
</svg>
